name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install R and R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-jsonlite r-cran-car

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[figure,test,mcp]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run performance benchmark
        run: python benchmarks/run_performance.py
