<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ResearchStat AI システムアーキテクチャ</title>
  <desc id="desc">Protocol-bound reproducible statistics platform architecture, from user data through planning, review, execution, validation, audit and publication figures.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#52606D"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324D}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.box{stroke-width:2}.line{stroke:#52606D;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="40" y="45" class="title">ResearchStat AI｜Protocol に基づく再現可能な統計</text>
  <rect x="25" y="75" width="1550" height="760" rx="18" fill="#F7F9FB" stroke="#7A8A99" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="50" y="108" class="label">ローカルプライバシー境界</text><text x="300" y="108" class="small">既定ではローカル処理｜マスキング｜識別子ハッシュ｜一時ワークスペースの消去</text>
  <g class="box">
    <rect x="55" y="160" width="210" height="120" rx="10" fill="#EAF5FA" stroke="#2F6B8A"/><text x="75" y="195" class="label">ユーザーとデータ</text><text x="75" y="225" class="small">自然言語リクエスト</text><text x="75" y="247" class="small">CSV / R データセット</text><text x="75" y="269" class="small">研究メタデータ</text>
    <rect x="325" y="150" width="230" height="140" rx="10" fill="#D9F0F5" stroke="#2F6B8A"/><text x="345" y="185" class="label">AI プランナー</text><text x="345" y="215" class="small">意図と研究デザインの推論</text><text x="345" y="237" class="small">変数と群構造</text><text x="345" y="259" class="small">Registry 内の Protocol のみ推薦</text>
    <rect x="325" y="355" width="230" height="140" rx="10" fill="#FFF4D6" stroke="#B7791F"/><text x="345" y="390" class="label">統計 Protocol Registry</text><text x="345" y="420" class="small">YAML による定義</text><text x="345" y="442" class="small">仮定｜有意水準</text><text x="345" y="464" class="small">欠測値方針｜効果量</text>
    <rect x="600" y="255" width="230" height="140" rx="10" fill="#FFF4D6" stroke="#B7791F"/><text x="620" y="290" class="label">人によるレビューゲート</text><text x="620" y="320" class="small">推薦を承認</text><text x="620" y="342" class="small">理由付きで上書き</text><text x="620" y="364" class="small">選好の根拠を記録</text>
    <rect x="900" y="190" width="250" height="120" rx="10" fill="#E7F5E8" stroke="#2E7D32"/><text x="920" y="225" class="label">実行レイヤー</text><text x="920" y="255" class="small">標準統計手法</text><text x="920" y="277" class="small">構造化された結果スキーマ</text>
    <rect x="875" y="360" width="170" height="95" rx="10" fill="#EAF1F8" stroke="#4C78A8"/><text x="895" y="395" class="label">Python エンジン</text><text x="895" y="425" class="small">scipy｜statsmodels</text>
    <rect x="1075" y="360" width="170" height="95" rx="10" fill="#EAF1F8" stroke="#4C78A8"/><text x="1095" y="395" class="label">R エンジン</text><text x="1095" y="425" class="small">Rscript サブプロセス</text>
    <rect x="900" y="515" width="250" height="125" rx="10" fill="#F0E9F7" stroke="#7B4FA1"/><text x="920" y="550" class="label">検証レイヤー</text><text x="920" y="580" class="small">Python と R の相互検証</text><text x="920" y="602" class="small">NIST StRD｜R 公式データセット</text><text x="920" y="624" class="small">許容差と重要度レポート</text>
    <rect x="600" y="550" width="230" height="125" rx="10" fill="#FBECEF" stroke="#A23E48"/><text x="620" y="585" class="label">監査レイヤー</text><text x="620" y="615" class="small">analysis_record.json</text><text x="620" y="637" class="small">データハッシュ｜バージョン｜警告</text>
    <rect x="1225" y="515" width="250" height="125" rx="10" fill="#FCEBDD" stroke="#C05621"/><text x="1245" y="550" class="label">出版品質 Figure Engine</text><text x="1245" y="580" class="small">SVG｜PDF｜TIFF 300 DPI</text><text x="1245" y="602" class="small">散布図｜箱ひげ図｜バイオリン図</text><text x="1245" y="624" class="small">figure_spec.json</text>
    <rect x="1225" y="705" width="250" height="100" rx="10" fill="#EAF5FA" stroke="#2F6B8A"/><text x="1245" y="740" class="label">再現可能な出力</text><text x="1245" y="770" class="small">結果｜Methods｜監査レポート</text><text x="1245" y="792" class="small">編集可能な出版品質 Figure</text>
    <rect x="55" y="705" width="210" height="100" rx="10" fill="#EEF1F3" stroke="#5C6770"/><text x="75" y="740" class="label">CLI｜API｜MCP</text><text x="75" y="770" class="small">stdio｜SSE</text><text x="75" y="792" class="small">streamable HTTP</text>
  </g>
  <path d="M265 220 H325" class="line"/><path d="M440 290 V355" class="line"/><path d="M555 425 H600 V325" class="line"/><path d="M830 325 H900 V250" class="line"/><path d="M1025 310 V360" class="line"/><path d="M1125 310 V360" class="line"/><path d="M960 455 V515" class="line"/><path d="M1160 455 V515" class="line"/><path d="M900 575 H830" class="line"/><path d="M1150 575 H1225" class="line"/><path d="M715 675 V705 H1225" class="line"/><path d="M1350 640 V705" class="line"/><path d="M265 755 H325 V220" class="line" stroke-dasharray="8 6"/>
  <text x="55" y="875" class="small">設計原則：AI が計画し、Protocol が制約し、エンジンが計算し、検証が問い直し、監査が記録する。</text>
</svg>
